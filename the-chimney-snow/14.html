<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Chimney Snow</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
(function(){
  const S=800, TAU=Math.PI*2, cv=document.getElementById('c'), ctx=cv.getContext('2d');

  // persistent sediment layer
  const sed=document.createElement('canvas'); sed.width=S; sed.height=S;
  const sctx=sed.getContext('2d');

  // soft particle sprites
  function sprite(r,g,b,a){
    const c=document.createElement('canvas'); c.width=c.height=32;
    const x=c.getContext('2d'), gr=x.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0,`rgba(${r},${g},${b},${a})`);
    gr.addColorStop(.4,`rgba(${r},${g},${b},${a*.4})`);
    gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    x.fillStyle=gr; x.fillRect(0,0,32,32); return c;
  }
  const sprB=sprite(210,220,232,.9), sprS=sprite(150,110,55,.7), sprD=sprite(150,160,175,.5);

  // value noise
  let perm=[];
  (function(){let s=20261116;const r=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
    for(let i=0;i<256;i++)perm[i]=i;
    for(let i=255;i>0;i--){const j=(r()*(i+1))|0,t=perm[i];perm[i]=perm[j];perm[j]=t;}})();
  const hash=(x,y)=>perm[(perm[x&255]+(y&255))&255]/255;
  const sm=t=>t*t*(3-2*t);
  function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1),u=sm(xf),v=sm(yf);
    return (a+(b-a)*u)+((c+(d-c)*u)-(a+(b-a)*u))*v;}

  const ventX=400, ventY=742, floorBase=796, MAXH=48;
  const heights=new Float32Array(S);
  function addSediment(x,y,p){
    const ix=Math.max(0,Math.min(S-1,x|0)), sy=floorBase-heights[ix];
    sctx.globalAlpha=.14;
    sctx.drawImage(sprD, x-p.size*1.6, sy-p.size*1.6, p.size*3.2, p.size*3.2);
    sctx.globalAlpha=1;
    const add=.14+p.size*.05;
    for(let dx=-2;dx<=2;dx++){const xx=ix+dx; if(xx<0||xx>=S)continue;
      const w=1-Math.abs(dx)*.22, nh=heights[ix]+add*w;
      if(nh>heights[xx])heights[xx]=Math.min(MAXH,nh);}
  }

  const P=[], MAX=3600;
  function spawn(){
    const w=(Math.random()-.5)*34;
    P.push({x:ventX+w, y:ventY+Math.random()*6,
      vx:(Math.random()-.5)*.5, vy:-.9-Math.random()*1.1,
      age:0, maxAge:520+Math.random()*360,
      size:1.2+Math.random()*2.4, weight:Math.random()*.2,
      heat:.7+Math.random()*.6, c:Math.random()<.75?0:1, ph:Math.random()*TAU});
  }

  let t=0;
  function step(){
    t+=1/60;
    for(let i=0;i<14&&P.length<MAX;i++)spawn();
    for(let i=P.length-1;i>=0;i--){
      const p=P[i]; p.age++;
      const nx=(vn(p.x*.004+t*.02, p.y*.004)*2-1);
      const ny=(vn(p.x*.004+100, p.y*.004+t*.015)*2-1);
      const buoy=.65*Math.exp(-p.age/90)*p.heat;
      const settle=.18+.28*(1-Math.exp(-p.age/140))+p.weight;
      const tvx=nx*.55-.08;
      const tvy=(settle-buoy)+ny*.18;
      p.vx+=(tvx-p.vx)*.06; p.vy+=(tvy-p.vy)*.06;
      p.x+=p.vx; p.y+=p.vy;
      const ix=Math.max(0,Math.min(S-1,p.x|0));
      if(p.y>=floorBase-heights[ix]){addSediment(p.x,p.y,p);P.splice(i,1);continue;}
      if(p.age>p.maxAge||p.x<-40||p.x>S+40||p.y<-40)P.splice(i,1);
    }
  }

  function drawSedimentBase(){
    ctx.beginPath(); ctx.moveTo(0,S);
    for(let x=0;x<=S;x+=4)ctx.lineTo(x,floorBase-heights[x]);
    ctx.lineTo(S,S); ctx.closePath();
    const g=ctx.createLinearGradient(0,floorBase-MAXH,0,S);
    g.addColorStop(0,"rgba(150,160,172,.22)"); g.addColorStop(1,"rgba(40,44,52,.5)");
    ctx.fillStyle=g; ctx.fill();
  }

  function render(){
    const g=ctx.createLinearGradient(0,0,0,S);
    g.addColorStop(0,"#04060c"); g.addColorStop(.5,"#020308"); g.addColorStop(1,"#050409");
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
    drawSedimentBase();
    ctx.drawImage(sed,0,0);

    let rg=ctx.createRadialGradient(ventX,ventY,0,ventX,ventY,95);
    rg.addColorStop(0,"rgba(70,90,120,.10)"); rg.addColorStop(.5,"rgba(30,45,70,.04)"); rg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=rg; ctx.fillRect(0,0,S,S);
    let vg=ctx.createRadialGradient(ventX,ventY,0,ventX,ventY,26);
    vg.addColorStop(0,"rgba(255,170,80,.22)"); vg.addColorStop(.5,"rgba(150,70,25,.08)"); vg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=vg; ctx.fillRect(0,0,S,S);

    ctx.globalCompositeOperation='lighter';
    for(const p of P){
      const life=1-p.age/p.maxAge, fade=Math.min(1,p.age/14)*Math.min(1,life*1.6);
      const dx=p.x-ventX, dy=p.y-ventY, d=Math.sqrt(dx*dx+dy*dy);
      const light=.25+.75*Math.max(0,1-d/220);
      if(p.c===0){
        const tw=.65+.35*Math.sin(t*1.2+p.ph);
        ctx.globalAlpha=fade*.5*light*tw;
        ctx.drawImage(sprB, p.x-p.size*1.5, p.y-p.size*1.5, p.size*3, p.size*3);
      }else{
        ctx.globalAlpha=fade*.34*light;
        ctx.drawImage(sprS, p.x-p.size*1.5, p.y-p.size*1.5, p.size*3, p.size*3);
      }
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }

  function loop(){ step(); render(); requestAnimationFrame(loop); }
  for(let i=0;i<260;i++)step();   // pre-warm so the plume is already dense
  loop();
})();
</script>
</body>
</html>
